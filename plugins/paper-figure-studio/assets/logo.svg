<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- 10% outer margin: content stays inside [26, 230] -->
  <rect x="28" y="28" width="200" height="200" rx="38" fill="#182232" stroke="#3B82F6" stroke-width="6"/>
  <!-- Top subtle academic grid -->
  <path d="M56 84 H200 M56 128 H200 M56 172 H200" stroke="#2A3B54" stroke-width="2" stroke-dasharray="5 5"/>
