  <rect x="146" y="64" width="58" height="44" rx="9" fill="#D1FAE5" stroke="#34D399" stroke-width="4"/>
  <path d="M163 91 L173 77 L183 95 L191 81" fill="none" stroke="#059669" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
