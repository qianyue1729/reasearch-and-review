  <rect x="52" y="136" width="152" height="58" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="4"/>
  <text x="96" y="173" font-family="Cambria Math, Georgia, serif" font-size="30" font-weight="bold" font-style="italic" fill="#1E293B">f(z</text>
  <text x="133" y="180" font-family="Cambria Math, Georgia, serif" font-size="19" font-weight="bold" fill="#B45309">i</text>
  <text x="142" y="173" font-family="Cambria Math, Georgia, serif" font-size="30" font-weight="bold" font-style="italic" fill="#1E293B">)</text>
  <!-- Magnifier check badge -->
